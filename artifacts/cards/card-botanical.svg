<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 105 148" width="105mm" height="148mm" role="img" aria-labelledby="cardTitle cardDesc">
  <title id="cardTitle">Mother's Gold Spice — thank-you card (A6)</title>
  <desc id="cardDesc">A6 portrait insert card. A mango branch drawn above a short thank-you note, a blank hand-signing area, a batch number slot and a placeholder for a QR code.</desc>

  <!-- ============================================================
       A6 = 105 x 148 mm. All coordinates below are millimetres.
       Safe area: x 8 to 97, y 8 to 140.
       ============================================================ -->

  <rect x="0" y="0" width="105" height="148" fill="#fbf6ec"/>

  <!-- ============================================================
       HERO — mango branch: stem, two lanceolate leaves, one fruit.
       Occupies y 10.8 to 36.3, x 38.5 to 67.0.
       ============================================================ -->
  <g fill="none" stroke="#7a1f10" stroke-linecap="round" stroke-linejoin="round">

    <!-- stem -->
    <path d="M 52.6 10.8 C 52.35 14.0 53.15 16.8 53.05 20.6" stroke-width="0.45"/>

    <!-- upper-left leaf: blade outline (upper edge, then lower edge reversed) -->
    <path d="M 52.71 15.0 C 47.6 11.8 42.5 11.0 38.5 10.9
             C 43.3 14.9 48.3 16.1 52.71 15.0 Z" stroke-width="0.42"/>
    <!-- upper-left leaf: midrib, stopping just short of the tip -->
    <path d="M 52.71 15.0 C 48.2 13.9 42.9 12.2 39.4 11.2" stroke-width="0.3"/>

    <!-- lower-right leaf: blade outline -->
    <path d="M 53.02 18.4 C 57.9 16.5 63.0 15.6 67.0 15.8
             C 62.6 19.6 57.6 20.4 53.02 18.4 Z" stroke-width="0.42"/>
    <!-- lower-right leaf: midrib -->
    <path d="M 53.02 18.4 C 57.8 18.5 62.9 17.4 66.0 16.2" stroke-width="0.3"/>

    <!-- pedicel: stem tip down to the fruit shoulder -->
    <path d="M 53.05 20.6 C 52.9 21.8 52.5 22.3 52.1 23.2" stroke-width="0.34"/>

    <!-- the mango: broad shoulder at the stalk, full belly on the left,
         tapering to a soft beak at lower right -->
    <path d="M 52.1 23.2
             C 48.9 23.6 47.4 26.3 47.5 29.8
             C 47.6 33.5 51.6 37.0 54.6 36.2
             C 57.2 34.5 58.1 31.2 57.5 28.2
             C 56.9 25.3 54.8 23.5 52.1 23.2 Z"
          fill="#f6b94a" stroke-width="0.42"/>
  </g>

  <!-- ============================================================
       HEADING
       ============================================================ -->
  <text x="52.5" y="46.5" text-anchor="middle"
        font-family="'Fraunces', Georgia, serif" font-weight="600" font-size="8.5"
        fill="#7a1f10">Thank you</text>

  <line x1="46.5" y1="51" x2="58.5" y2="51" stroke="#e08712" stroke-width="0.45" stroke-linecap="round"/>

  <!-- ============================================================
       BODY COPY
       ============================================================ -->
  <g font-family="'Inter', sans-serif" font-size="3" fill="#2a1a10" text-anchor="middle">
    <text x="52.5" y="58.0">You are among our first customers. That is</text>
    <text x="52.5" y="62.4">not a small thing to us.</text>

    <text x="52.5" y="68.8">My mother cooked this in our kitchen in</text>
    <text x="52.5" y="73.2">Bangalore, in batches small enough that</text>
    <text x="52.5" y="77.6">she still remembers each one.</text>

    <text x="52.5" y="84.0">If it is good, leave a review at</text>
    <text x="52.5" y="88.4"><tspan fill="#b8341d" font-weight="600">mothersgoldspice.com</tspan>. If not, tell us anyway.</text>
  </g>

  <!-- ============================================================
       SIGNING AREA — deliberately empty.
       Clear band: x 25 to 80 (55 mm) by y 92 to 108 (16 mm).
       Nothing may be drawn inside it.
       ============================================================ -->
  <line x1="25" y1="108" x2="80" y2="108" stroke="#2a1a10" stroke-opacity="0.45" stroke-width="0.3"/>
  <line x1="25" y1="106.6" x2="25" y2="108" stroke="#2a1a10" stroke-opacity="0.45" stroke-width="0.3"/>
  <line x1="80" y1="106.6" x2="80" y2="108" stroke="#2a1a10" stroke-opacity="0.45" stroke-width="0.3"/>

  <text x="52.5" y="111.8" text-anchor="middle"
        font-family="'Inter', sans-serif" font-size="2.5" letter-spacing="0.08"
        fill="#2a1a10" fill-opacity="0.55">Signed above by hand, one card at a time.</text>

  <!-- ============================================================
       FOOTER
       ============================================================ -->
  <text x="8" y="122"
        font-family="'Fraunces', Georgia, serif" font-style="italic" font-weight="600"
        font-size="5.4" fill="#2a1a10">Mother's Gold Spice</text>

  <text x="8" y="127"
        font-family="'Inter', sans-serif" font-size="2.7"
        fill="#2a1a10" fill-opacity="0.6">Scan to leave your review</text>

  <line x1="8" y1="130.8" x2="68" y2="130.8" stroke="#2a1a10" stroke-opacity="0.18" stroke-width="0.3"/>

  <!-- batch number: label plus a blank rule to write on -->
  <text x="8" y="136.3"
        font-family="'Inter', sans-serif" font-size="2.9" font-weight="600"
        fill="#7a1f10">Batch No.</text>
  <line x1="25" y1="136.9" x2="58" y2="136.9" stroke="#2a1a10" stroke-opacity="0.4" stroke-width="0.3"/>

  <!-- QR placeholder — exactly 22 x 22 mm, replaced downstream -->
  <rect id="qr-slot" x="74" y="116" width="22" height="22"
        fill="#fbf6ec" stroke="#7a1f10" stroke-opacity="0.28" stroke-width="0.3"
        stroke-dasharray="1.4 1.4"/>
</svg>
