<svg xmlns="http://www.w3.org/2000/svg" width="105mm" height="148mm" viewBox="0 0 105 148" role="img" aria-labelledby="cardTitle cardDesc">
  <title id="cardTitle">Mother's Gold Spice — thank-you card (A6)</title>
  <desc id="cardDesc">An A6 insert card styled as an index card from a family recipe box, with a hand-signing area, a batch number slot and a placeholder for a QR code.</desc>

  <!-- Card stock -->
  <rect x="0" y="0" width="105" height="148" fill="#fbf6ec"/>

  <!-- ============ HEADER: the card as something filed away ============ -->
  <g>
    <text x="8" y="12.2" font-family="'Inter', sans-serif" font-size="2.2" font-weight="600"
          letter-spacing="0.62" fill="#7a1f10">FROM THE FAMILY RECIPE BOX</text>

    <text x="8" y="18.8" font-family="'Fraunces', Georgia, serif" font-style="italic"
          font-size="5.2" font-weight="600" fill="#2a1a10">Mother's Gold Spice</text>

    <!-- Filing tab -->
    <rect x="70" y="12.4" width="27" height="8.2" rx="1.2" fill="#f6b94a" fill-opacity="0.3"/>
    <text x="83.5" y="17.4" text-anchor="middle" font-family="'Inter', sans-serif" font-size="2.2"
          font-weight="600" letter-spacing="0.42" fill="#7a1f10">MANGO PICKLE</text>

    <!-- Double header rule, as on a ruled index card -->
    <line x1="8" y1="20.6" x2="97" y2="20.6" stroke="#b8341d" stroke-opacity="0.5" stroke-width="0.35"/>
    <line x1="8" y1="21.7" x2="97" y2="21.7" stroke="#b8341d" stroke-opacity="0.22" stroke-width="0.25"/>
  </g>

  <!-- ============ THE ONE FOCAL POINT ============ -->
  <text x="8" y="35.5" font-family="'Fraunces', Georgia, serif" font-style="italic"
        font-size="9" font-weight="600" fill="#7a1f10">Thank you.</text>

  <!-- Small mango mark, echoing the jar label -->
  <g stroke="#e08712" stroke-width="0.35" stroke-linecap="round">
    <line x1="8" y1="42" x2="16" y2="42"/>
    <line x1="23" y1="42" x2="31" y2="42"/>
  </g>
  <path d="M 0 -1.5 C 1.07 -0.64 1.07 0.86 0 1.5 C -1.07 0.86 -1.07 -0.64 0 -1.5 Z"
        transform="translate(19.5, 42)" fill="#e08712"/>

  <!-- ============ RULED BODY — the copy sits on the lines ============ -->
  <g stroke="#2a1a10" stroke-opacity="0.09" stroke-width="0.25">
    <line x1="8" y1="53" x2="97" y2="53"/>
    <line x1="8" y1="58.8" x2="97" y2="58.8"/>
    <line x1="8" y1="64.6" x2="97" y2="64.6"/>
    <line x1="8" y1="70.4" x2="97" y2="70.4"/>
    <line x1="8" y1="76.2" x2="97" y2="76.2"/>
    <line x1="8" y1="82" x2="97" y2="82"/>
    <line x1="8" y1="87.8" x2="97" y2="87.8"/>
  </g>

  <g font-family="'Inter', sans-serif" font-size="3.1" fill="#2a1a10">
    <text x="8" y="51.4">Yours is among the first jars out of our kitchen.</text>
    <text x="8" y="57.2">My mother cooked it — mangoes cut, salted, set in</text>
    <text x="8" y="63">mustard oil, in batches we still stir by hand.</text>

    <text x="8" y="74.6">When the jar is finished, leave a review at</text>
    <text x="8" y="80.4"><tspan fill="#b8341d" font-weight="500">mothersgoldspice.com</tspan> — we read each one, and the</text>
    <text x="8" y="86.2">next batch is better for it.</text>
  </g>

  <!-- ============ SIGNING AREA — deliberately empty, 56 x 21 mm ============ -->
  <g>
    <text x="8" y="100" font-family="'Inter', sans-serif" font-size="2.2" font-weight="600"
          letter-spacing="0.6" fill="#7a1f10">SIGNED BY THE COOK</text>

    <!-- nothing is drawn between y=100 and the rule below: this is where the pen goes -->
    <line x1="8" y1="122" x2="64" y2="122" stroke="#2a1a10" stroke-opacity="0.4" stroke-width="0.3"/>

    <text x="8" y="125.8" font-family="'Inter', sans-serif" font-size="2.15"
          fill="#2a1a10" fill-opacity="0.55">in ink, on every card we send</text>
  </g>

  <!-- ============ QR PLACEHOLDER — exactly 22 x 22 mm ============ -->
  <rect id="qr-slot" x="75" y="98" width="22" height="22" fill="none"
        stroke="#2a1a10" stroke-opacity="0.22" stroke-width="0.3" stroke-dasharray="1.2 1.2"/>
  <g font-family="'Inter', sans-serif" font-size="2" font-weight="600" letter-spacing="0.3"
     fill="#7a1f10" text-anchor="middle">
    <text x="86" y="123.6">SCAN TO LEAVE</text>
    <text x="86" y="126.8">A REVIEW</text>
  </g>

  <!-- ============ BATCH SLOT — filled in by hand, per batch ============ -->
  <text x="8" y="137.5" font-family="'Inter', sans-serif" font-size="2.6"
        fill="#2a1a10" fill-opacity="0.8">Batch No.</text>
  <line x1="22" y1="137.9" x2="48" y2="137.9" stroke="#2a1a10" stroke-opacity="0.35" stroke-width="0.3"/>
</svg>
