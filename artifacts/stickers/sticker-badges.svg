<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 26" width="88mm" height="26mm" role="img" aria-labelledby="badgesTitle badgesDesc">
  <title id="badgesTitle">Mother's Gold Spice — two badge stickers</title>
  <desc id="badgesDesc">Two 42 by 26 mm die-cut badges side by side. Left: a rubber-stamp frame reading SMALL BATCH with the brand name beneath. Right: ONE OF THE FIRST HUNDRED JARS above a cream plaque marked No. with a ruled blank for a hand-written number.</desc>

  <!-- ================================================================
       Artboard 88 x 26 mm. All coordinates are millimetres.
       Badge one  : x  0 .. 42   safe area x  3 .. 39, y 3 .. 23
       Gutter     : x 42 .. 46   left empty, the sheet cuts here
       Badge two  : x 46 .. 88   safe area x 49 .. 85, y 3 .. 23
       Die-cut outline is added by the sheet, not drawn here.
       Palette: cream #fbf6ec, ink #2a1a10, spice-700 #7a1f10,
                spice-500 #b8341d, mango-300 #f6b94a, mango-500 #e08712
       ================================================================ -->

  <!-- ================================================================
       BADGE ONE — SMALL BATCH, set as a hand stamp on cream.
       ================================================================ -->
  <rect x="0" y="0" width="42" height="26" rx="4" fill="#fbf6ec"/>

  <!-- stamp frame: heavy outer rule with a hairline inside it -->
  <rect x="5.5" y="3.6" width="31" height="14.4" rx="2.2"
        fill="none" stroke="#7a1f10" stroke-width="0.6"/>
  <rect x="6.6" y="4.7" width="28.8" height="12.2" rx="1.4"
        fill="none" stroke="#7a1f10" stroke-width="0.32"/>

  <!-- the two words, stacked and letterspaced like inked type.
       x is nudged +0.18 to offset the trailing letter-space that
       centred text carries. -->
  <g font-family="'Fraunces', Georgia, serif" font-weight="600" font-size="5.2"
     letter-spacing="0.35" fill="#7a1f10" text-anchor="middle">
    <text x="21.18" y="9.5">SMALL</text>
    <text x="21.18" y="15.75">BATCH</text>
  </g>

  <!-- divider: a broken rule with a mango lozenge at its centre -->
  <g stroke="#b8341d" stroke-width="0.35" stroke-linecap="round">
    <line x1="9.8" y1="10.8" x2="18.6" y2="10.8"/>
    <line x1="23.4" y1="10.8" x2="32.2" y2="10.8"/>
  </g>
  <path d="M 21 9.95 L 21.85 10.8 L 21 11.65 L 20.15 10.8 Z" fill="#e08712"/>

  <!-- brand name, small, beneath the stamp -->
  <text x="21" y="21.5" text-anchor="middle"
        font-family="'Fraunces', Georgia, serif" font-style="italic" font-weight="600"
        font-size="3.15" fill="#2a1a10">Mother's Gold Spice</text>

  <!-- ================================================================
       BADGE TWO — the numbered jar. The cream plaque is the point:
       a number goes in it by hand, in ink, one jar at a time.
       ================================================================ -->
  <rect x="46" y="0" width="42" height="26" rx="4" fill="#7a1f10"/>

  <!-- the sentence runs top to bottom and finishes inside the plaque:
       one of the first hundred — jar no. ___ -->
  <text x="67.15" y="7" text-anchor="middle"
        font-family="'Inter', sans-serif" font-weight="600" font-size="3"
        letter-spacing="0.3" fill="#f6b94a">ONE OF THE FIRST</text>

  <text x="67" y="13.6" text-anchor="middle"
        font-family="'Fraunces', Georgia, serif" font-weight="600" font-size="5.6"
        fill="#fbf6ec">HUNDRED</text>

  <!-- write-in plaque: 32 x 6.4 mm of clear cream, ruled for the digits -->
  <rect x="51" y="16" width="32" height="6.4" rx="1.6" fill="#fbf6ec"/>
  <text x="53.4" y="20.4"
        font-family="'Fraunces', Georgia, serif" font-style="italic" font-weight="600"
        font-size="3.4" fill="#7a1f10">Jar No.</text>
  <line x1="67.6" y1="20.7" x2="80.4" y2="20.7"
        stroke="#e08712" stroke-width="0.35" stroke-linecap="round"/>
</svg>
