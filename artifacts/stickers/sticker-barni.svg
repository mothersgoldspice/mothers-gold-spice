<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 42 42" width="42mm" height="42mm" role="img" aria-labelledby="barniTitle barniDesc">
  <title id="barniTitle">Mother's Gold Spice — barni sticker (42 mm circle)</title>
  <desc id="barniDesc">A traditional Indian ceramic pickling jar with a cloth tied over its mouth, standing in front of the sun. The words "set in the sun" curve along the bottom of the circle.</desc>

  <!-- ============================================================
       42 x 42 mm. All coordinates below are millimetres.
       Die-cut circle: cx 21, cy 21, r 21. The sheet cuts it; this
       file must not draw that outline.
       Safe area: everything stays within r 18 of (21, 21).
       Furthest mark from centre is the sun's crown at r 16.4.
       ============================================================ -->

  <defs>
    <!-- the jar silhouette, reused to clip the glaze bands so they
         stop exactly on the pot's edge rather than near it -->
    <clipPath id="barni-body">
      <path d="M 16.6 14.6
               L 25.4 14.6
               L 25.4 15.4
               C 25.4 15.9, 24.6 15.75, 24.6 16.3
               L 24.6 18.4
               C 26.7 19.4, 28.7 21.1, 29.4 23.8
               C 29.5 26.3, 28.1 28.6, 26.2 29.9
               L 15.8 29.9
               C 13.9 28.6, 12.5 26.3, 12.6 23.8
               C 13.3 21.1, 15.3 19.4, 17.4 18.4
               L 17.4 16.3
               C 17.4 15.75, 16.6 15.9, 16.6 15.4
               Z"/>
    </clipPath>

    <!-- baseline for the curved line of type: the lower 120 degrees of
         a circle of radius 16.4, running left to right through the
         bottom so the letters sit upright -->
    <path id="barni-arc" fill="none"
          d="M 6.798 29.2 A 16.4 16.4 0 0 0 35.202 29.2"/>
  </defs>

  <!-- ============================================================
       BODY — fills the whole die-cut circle.
       ============================================================ -->
  <circle cx="21" cy="21" r="21" fill="#fbf6ec"/>

  <!-- ============================================================
       THE SUN — one flat disc, sat high so a band of cream is left
       at the bottom for the type. The jar's base finishes just
       inside its lower edge, so the pot reads as standing on it.
       ============================================================ -->
  <circle cx="21" cy="18.3" r="13.7" fill="#f6b94a"/>

  <!-- ============================================================
       THE BARNI — belly 16.8 mm across, short neck, flared lip.
       The lip and neck sit under the cloth and are drawn anyway, so
       the shape beneath the cloth is a real pot.
       ============================================================ -->
  <path d="M 16.6 14.6
           L 25.4 14.6
           L 25.4 15.4
           C 25.4 15.9, 24.6 15.75, 24.6 16.3
           L 24.6 18.4
           C 26.7 19.4, 28.7 21.1, 29.4 23.8
           C 29.5 26.3, 28.1 28.6, 26.2 29.9
           L 15.8 29.9
           C 13.9 28.6, 12.5 26.3, 12.6 23.8
           C 13.3 21.1, 15.3 19.4, 17.4 18.4
           L 17.4 16.3
           C 17.4 15.75, 16.6 15.9, 16.6 15.4
           Z"
        fill="#e08712" stroke="#7a1f10" stroke-width="0.5" stroke-linejoin="round"/>

  <!-- glaze banding: one hairline on the shoulder, one broad band on
       the belly. Both sag in the middle so the pot reads as round.
       Clipped to the body, so they end on the outline. -->
  <g clip-path="url(#barni-body)">
    <path d="M 11.0 21.4 C 15.0 22.2, 27.0 22.2, 31.0 21.4"
          fill="none" stroke="#b8341d" stroke-width="0.55"/>
    <path d="M 11.0 23.4 C 15.0 24.2, 27.0 24.2, 31.0 23.4
             L 31.0 25.6 C 27.0 26.4, 15.0 26.4, 11.0 25.6 Z"
          fill="#b8341d"/>
  </g>

  <!-- ============================================================
       THE CLOTH — a square of muslin dropped over the mouth and
       pulled in at the neck. Three corners hang below the swags:
       left at x 14.6, front at x 21, right at x 27.4. The outer two
       hang clear of the pot, which is what says "cloth" at 42 mm.
       ============================================================ -->
  <path d="M 14.6 19.9
           C 15.1 18.5, 16.3 17.3, 17.0 16.3
           C 16.2 15.4, 15.5 14.8, 15.5 13.6
           C 15.5 11.9, 17.9 10.8, 21.0 10.8
           C 24.1 10.8, 26.5 11.9, 26.5 13.6
           C 26.5 14.8, 25.8 15.4, 25.0 16.3
           C 25.7 17.3, 26.9 18.5, 27.4 19.9
           C 26.3 19.0, 25.2 18.6, 24.2 18.6
           C 23.2 18.6, 22.0 19.2, 21.0 19.9
           C 20.0 19.2, 18.8 18.6, 17.8 18.6
           C 16.8 18.6, 15.7 19.0, 14.6 19.9
           Z"
        fill="#fbf6ec" stroke="#7a1f10" stroke-width="0.45" stroke-linejoin="round"/>

  <!-- two gathers running up out of the tie -->
  <g fill="none" stroke="#7a1f10" stroke-width="0.38" stroke-linecap="round">
    <path d="M 19.2 15.6 C 18.9 14.3, 19.1 12.9, 19.9 11.8"/>
    <path d="M 22.9 15.7 C 23.2 14.5, 23.0 13.3, 22.4 12.4"/>
  </g>

  <!-- ============================================================
       THE STRING — one turn round the neck, a knot on the right and
       two short ends left hanging.
       ============================================================ -->
  <g stroke="#b8341d" fill="none" stroke-linecap="round">
    <path d="M 17.0 16.05 C 18.7 16.9, 23.3 16.9, 25.0 16.05" stroke-width="0.85"/>
    <path d="M 25.1 16.6 C 25.9 17.3, 26.2 18.0, 26.0 18.8" stroke-width="0.6"/>
    <path d="M 25.0 16.6 C 25.5 17.3, 25.4 17.9, 24.95 18.35" stroke-width="0.6"/>
  </g>
  <circle cx="25.0" cy="16.35" r="0.62" fill="#b8341d"/>

  <!-- ============================================================
       TYPE — 3.5 mm, letterspaced, on the bottom arc. It names what
       the picture is doing and nothing else.
       ============================================================ -->
  <text font-family="'Inter', sans-serif" font-size="3.5" font-weight="500"
        letter-spacing="0.24" fill="#7a1f10">
    <textPath href="#barni-arc" startOffset="50%" text-anchor="middle">SET IN THE SUN</textPath>
  </text>
</svg>
