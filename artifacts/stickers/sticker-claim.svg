<svg xmlns="http://www.w3.org/2000/svg" width="42mm" height="42mm" viewBox="0 0 42 42" role="img" aria-labelledby="stickerTitle stickerDesc">
  <title id="stickerTitle">Made in a kitchen, not a factory</title>
  <desc id="stickerDesc">Mother's Gold Spice — round 42 mm seal sticker, typographic only.</desc>

  <!-- body: fills the whole die-cut circle -->
  <circle cx="21" cy="21" r="21" fill="#fbf6ec"/>

  <!-- seal ring, 4mm clear of the cut edge -->
  <circle cx="21" cy="21" r="17" fill="none" stroke="#7a1f10" stroke-width="0.7"/>

  <!-- mango leaf mark -->
  <g transform="rotate(-13 21 8.3)">
    <path d="M18.3 8.3 Q21 5.95 23.7 8.3 Q21 10.5 18.3 8.3 Z" fill="#e08712"/>
    <path d="M18.85 8.45 H23.15" stroke="#fbf6ec" stroke-width="0.34" stroke-linecap="butt"/>
  </g>

  <!-- the claim -->
  <text x="21" y="13.8" text-anchor="middle" textLength="24.3" lengthAdjust="spacing"
        font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="3.8" font-weight="600"
        fill="#2a1a10">MADE IN A</text>

  <text x="21" y="20.5" text-anchor="middle" textLength="30" lengthAdjust="spacing"
        font-family="Fraunces, Georgia, serif" font-size="6.3" font-weight="700"
        fill="#7a1f10">KITCHEN</text>

  <path d="M6 23.6 H12.3 M29.7 23.6 H36" stroke="#7a1f10" stroke-width="0.45" stroke-linecap="butt"/>

  <text x="21" y="24.9" text-anchor="middle" textLength="14.1" lengthAdjust="spacing"
        font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="3.8" font-weight="600"
        fill="#2a1a10">NOT A</text>

  <text x="21" y="30" text-anchor="middle" textLength="25.6" lengthAdjust="spacing"
        font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="4.4" font-weight="500"
        fill="#2a1a10">FACTORY</text>

  <!-- full stop -->
  <path d="M21 33.2 L21.9 34.1 L21 35 L20.1 34.1 Z" fill="#e08712"/>
</svg>
