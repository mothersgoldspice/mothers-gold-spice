<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 42 42" width="42mm" height="42mm" role="img" aria-labelledby="roundelTitle roundelDesc">
  <title id="roundelTitle">Mother's Gold Spice — the spice roundel</title>
  <desc id="roundelDesc">A 42 mm round die-cut sticker. A gold band carries the words FOUR THINGS above and MOTHER'S GOLD SPICE below. Inside, drawn as an old seed-packet plate, the four things themselves: a raw mango with a pair of leaves at the top, a dried red chilli down the left, a fenugreek sprig on the right, and mustard seeds gathered at the foot.</desc>

  <!-- ================================================================
       Artboard 42 x 42 mm, all coordinates in millimetres.
       Circle centre 21,21   radius 21
       Cutter safe line      r 18   (nothing beyond it)
       Gold band             r 13.8 .. 17.6
       Inner field           r 13.8, artwork kept inside r 12.8
       Die-cut outline is added by the sheet, not drawn here.
       Palette: cream #fbf6ec, ink #2a1a10, spice-700 #7a1f10,
                spice-500 #b8341d, mango-300 #f6b94a, mango-500 #e08712
       ================================================================ -->

  <defs>
    <!-- baseline for the top word: glyphs stand outward from it -->
    <path id="arcTop" fill="none"
          d="M 6.819,18.5 A 14.4,14.4 0 0,1 35.181,18.5"/>
    <!-- baseline for the bottom words: run anticlockwise so they sit upright,
         glyphs hang inward from it -->
    <path id="arcBottom" fill="none"
          d="M 4.258,23.951 A 17,17 0 0,0 37.742,23.951"/>
  </defs>

  <!-- body of the sticker -->
  <circle cx="21" cy="21" r="21" fill="#fbf6ec"/>

  <!-- the gold band, then the field punched back out of it -->
  <circle cx="21" cy="21" r="17.6" fill="#f6b94a"/>
  <circle cx="21" cy="21" r="13.8" fill="#fbf6ec"/>
  <circle cx="21" cy="21" r="13.35" fill="none" stroke="#7a1f10" stroke-width="0.35"/>

  <!-- lettering on the band -->
  <text font-family="'Inter', sans-serif" font-weight="600" font-size="3.6"
        letter-spacing="0.55" fill="#7a1f10">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">FOUR THINGS</textPath>
  </text>
  <text font-family="'Inter', sans-serif" font-weight="600" font-size="3.4"
        letter-spacing="0.2" fill="#7a1f10">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">MOTHER&#8217;S GOLD SPICE</textPath>
  </text>

  <!-- lozenges closing the band at three and nine o'clock -->
  <path d="M 5.3,20.1 L 6.2,21 L 5.3,21.9 L 4.4,21 Z" fill="#7a1f10"/>
  <path d="M 36.7,20.1 L 37.6,21 L 36.7,21.9 L 35.8,21 Z" fill="#7a1f10"/>

  <!-- ================================================================
       THE FOUR THINGS. Line work spice-700, fills from the mango range.
       Each is drawn as the silhouette that names it and nothing more.
       ================================================================ -->

  <g stroke="#7a1f10" stroke-width="0.42" stroke-linejoin="round" stroke-linecap="round">

    <!-- RAW MANGO — top. Asymmetric: full right shoulder, beak at the foot,
         a pair of leaves on the stalk to close the top of the wreath. -->
    <g transform="translate(21,18.3) rotate(-6)">
      <path d="M -1.4,-4.2 C -1.6,-4.9 -1.8,-5.5 -2,-6.2" fill="none" stroke-width="0.5"/>
      <path d="M -1.85,-5.75 C -0.7,-7.7 1.3,-8.3 2.9,-7.95
               C 2.2,-6.35 0.1,-5.45 -1.85,-5.75 Z" fill="#f6b94a"/>
      <path d="M -1.7,-5.9 C -0.6,-6.5 1,-7.15 2.55,-7.75" fill="none" stroke-width="0.34"/>
      <path d="M -1.95,-5.9 C -3.3,-7.7 -4.7,-8.15 -5.9,-7.5
               C -5,-6.1 -3.5,-5.5 -1.95,-5.9 Z" fill="#f6b94a"/>
      <path d="M -2.05,-6.05 C -3.3,-6.65 -4.6,-7.1 -5.7,-7.45" fill="none" stroke-width="0.34"/>
      <path d="M -1.3,-4.2 C 1,-4.8 3.3,-3.2 3.6,-1
               C 4,1.4 2.7,3.8 0.7,4.4
               C 0.2,4.6 -0.3,4.4 -0.7,4
               C -2.6,2.7 -3.5,0.6 -3.4,-1.3
               C -3.3,-2.8 -2.6,-3.9 -1.3,-4.2 Z" fill="#e08712"/>
    </g>

    <!-- DRIED RED CHILLI — down the left, one long tapering curve. -->
    <g transform="translate(14.4,24.2) rotate(12)">
      <path d="M 0,-5.2 C -0.15,-6.1 -0.5,-6.8 -1.2,-7.3" fill="none" stroke-width="0.5"/>
      <path d="M -1.15,-5 C -2.05,-2 -1.75,1.6 0.55,5.6
               C 0.85,6.05 1.25,5.95 1.25,5.45
               C 1.6,1.4 1.5,-2.4 1.15,-5
               C 0.5,-5.5 -0.5,-5.5 -1.15,-5 Z" fill="#b8341d"/>
    </g>

    <!-- FENUGREEK — the right. Three leaflets on one stalk, as methi grows. -->
    <g transform="translate(27,24) rotate(34) scale(1.06)" stroke-width="0.396">
      <path d="M 0,0 C 0.15,1 0.4,1.9 0.9,2.7" fill="none" stroke-width="0.472"/>
      <path d="M 0,0 C -1.1,-1.15 -1.15,-2.5 0,-3.8 C 1.15,-2.5 1.1,-1.15 0,0 Z"
            fill="#f6b94a" transform="rotate(-54)"/>
      <path d="M 0,0 C -1.1,-1.15 -1.15,-2.5 0,-3.8 C 1.15,-2.5 1.1,-1.15 0,0 Z"
            fill="#f6b94a" transform="rotate(54)"/>
      <path d="M 0,0 C -1.15,-1.2 -1.2,-2.6 0,-4.1 C 1.2,-2.6 1.15,-1.2 0,0 Z"
            fill="#f6b94a"/>
    </g>

    <!-- MUSTARD SEED — strewn across the foot, one stray to the left. -->
    <g fill="#e08712" stroke-width="0.36">
      <circle cx="20"    cy="29.3"  r="0.8"/>
      <circle cx="21.75" cy="29.9"  r="0.86"/>
      <circle cx="23.4"  cy="29.2"  r="0.74"/>
      <circle cx="20.9"  cy="28.05" r="0.66"/>
      <circle cx="22.6"  cy="27.95" r="0.62"/>
      <circle cx="18.35" cy="28.2"  r="0.56"/>
    </g>

  </g>
</svg>
